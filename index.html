<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarkt Prijsvergelijker</title>
  <link rel="preconnect" href="https://www.checkjebon.nl">
  <link rel="preload" href="https://www.checkjebon.nl/data/supermarkets.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
  <style>
    :root {
      --ink:          #0f172a;
      --blue:         #1a56db;
      --blue-dark:    #1340a8;
      --blue-tint:    rgba(26,86,219,.08);
      --bg:           #f9fafb;
      --bg-dark:      #f1f5f9;
      --amber:        #f59e0b;
      --amber-bg:     #fffbeb;
      --amber-border: #fcd34d;
      --text:         #111827;
      --text-mid:     #374151;
      --text-soft:    #6b7280;
      --border:       #e5e7eb;
      --white:        #ffffff;
      --r:            10px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.06);
      --shadow:       0 3px 8px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
      padding: 2.75rem 1.5rem 3.5rem;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,60,180,.55) 0%, transparent 65%);
      top: -210px; right: -120px;
      pointer-events: none;
    }

    header::after {
      content: '';
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,60,180,.3) 0%, transparent 70%);
      bottom: 10px; left: -60px;
      pointer-events: none;
    }

    .header-content {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .header-label {
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,.36);
      margin-bottom: 0.9rem;
    }

    h1 {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(2.1rem, 5.5vw, 3.1rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .header-tagline {
      font-size: 0.875rem;
      color: rgba(255,255,255,.36);
      margin-bottom: 2.1rem;
    }

    /* ── Search bar ──────────────────────────────────── */
    #search-wrap {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgba(255,255,255,.32);
      transition: color .2s;
    }

    #search-wrap:focus-within .search-icon { color: rgba(255,255,255,.6); }

    #search {
      width: 100%;
      padding: .85rem 1.1rem .85rem 2.65rem;
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,.15);
      border-radius: 999px;
      outline: none;
      transition: background .2s, border-color .2s, box-shadow .2s;
      backdrop-filter: blur(8px);
    }

    #search::placeholder       { color: rgba(255,255,255,.38); }
    #search:focus {
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.3);
      box-shadow: 0 0 0 4px rgba(255,255,255,.07);
    }
    #search:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    #search:disabled::placeholder {
      animation: loading-pulse 1.8s ease-in-out infinite;
    }

    @keyframes loading-pulse {
      0%, 100% { opacity: .38; }
      50%       { opacity: .7;  }
    }

    /* ── Size filter ─────────────────────────────────── */
    #filter-wrap {
      max-width: 440px;
      margin: 0.75rem auto 0;
    }

    #filter-row {
      display: flex;
      justify-content: center;
    }

    #filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 0.38rem 0.5rem 0.38rem 0.75rem;
      color: rgba(255,255,255,.5);
      font-size: 0.8rem;
      transition: border-color .2s;
    }

    #filter-pill:focus-within {
      border-color: rgba(255,255,255,.32);
    }

    #filter-pill input[type=number] {
      width: 52px;
      background: none;
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }

    #filter-pill input[type=number]::placeholder { color: rgba(255,255,255,.3); }
    #filter-pill input[type=number]::-webkit-outer-spin-button,
    #filter-pill input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    #filter-unit-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,.38);
      min-width: 3.5ch;
    }

    .filter-sep { color: rgba(255,255,255,.3); }

    #filter-clear {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.08);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      color: rgba(255,255,255,.4);
      padding: 0;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    #filter-clear:hover {
      background: rgba(255,255,255,.18);
      color: rgba(255,255,255,.85);
    }

    /* ── Supermarket & unit-type pill toggles ─────────── */
    #unit-filter-wrap, #sm-filter-wrap {
      max-width: 600px;
      margin: 0.9rem auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.4rem;
      justify-content: center;
      align-items: center;
    }

    #unit-filter-wrap { margin-top: 0.6rem; }

    .filter-prefix {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.28);
    }

    .sm-pill {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.28);
      border: 1.5px solid rgba(255,255,255,.1);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      transition: background .15s, color .15s, border-color .15s, transform .1s;
      line-height: 1;
    }

    .sm-pill.active {
      background: rgba(255,255,255,.14);
      color: #fff;
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .sm-pill:hover {
      background: rgba(255,255,255,.17);
      color: rgba(255,255,255,.9);
      border-color: rgba(255,255,255,.3);
    }

    .sm-pill:active {
      transform: scale(0.93);
    }

    /* Wave divider at bottom of header */
    .header-wave {
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 52px;
      overflow: hidden;
    }

    .header-wave svg {
      display: block;
      width: 100%; height: 100%;
    }

    /* ── Status / empty state ────────────────────────── */
    #status {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-soft);
      font-size: .875rem;
      line-height: 1.6;
    }

    /* ── Results ─────────────────────────────────────── */
    #results {
      max-width: 760px;
      margin: 0.5rem auto 3rem;
      padding: 0 1rem;
    }

    .result-row {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: .9rem 1.1rem;
      margin-bottom: .5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 1rem;
      align-items: center;
      box-shadow: var(--shadow-sm);
      animation: card-in .32s ease both;
      transition: box-shadow .15s, transform .15s;
    }

    .result-row:hover {
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .result-row.cheapest {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      border-left: 3px solid var(--amber);
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .result-row:nth-child(1)  { animation-delay:   0ms }
    .result-row:nth-child(2)  { animation-delay:  48ms }
    .result-row:nth-child(3)  { animation-delay:  96ms }
    .result-row:nth-child(4)  { animation-delay: 144ms }
    .result-row:nth-child(5)  { animation-delay: 192ms }
    .result-row:nth-child(6)  { animation-delay: 240ms }
    .result-row:nth-child(7)  { animation-delay: 288ms }
    .result-row:nth-child(8)  { animation-delay: 336ms }
    .result-row:nth-child(n+9){ animation-delay: 380ms }

    /* Supermarket chip */
    .supermarket-name {
      display: inline-block;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
      color: var(--blue-dark);
      background: var(--blue-tint);
      padding: .22rem .55rem;
      border-radius: 5px;
      white-space: nowrap;
    }

    .cheapest .supermarket-name {
      color: #92400e;
      background: rgba(245,158,11,.1);
    }

    /* Product name */
    .product-name {
      font-size: .875rem;
      color: var(--text-mid);
      line-height: 1.45;
    }

    .product-name a {
      color: inherit;
      text-decoration: none;
    }

    .product-name a:hover {
      color: var(--blue);
      text-decoration: underline;
      text-decoration-color: var(--border);
      text-underline-offset: 3px;
    }

    /* Cheapest badge */
    .cheapest-badge {
      display: inline-block;
      font-size: .6rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      background: var(--amber);
      color: #78350f;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 7px;
      vertical-align: middle;
    }

    /* Prices column — unit price is primary, regular price is secondary */
    .prices {
      text-align: right;
      white-space: nowrap;
    }

    .unit-price {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.01em;
    }

    .cheapest .unit-price { color: #b45309; }

    .price {
      font-size: .72rem;
      font-weight: 400;
      color: var(--text-soft);
      margin-top: 1px;
    }

    .cheapest .price { color: rgba(180,83,9,.65); }

    .size {
      font-size: .7rem;
      color: var(--text-soft);
      margin-top: 1px;
    }

    /* ── Mobile ──────────────────────────────────────── */
    @media (max-width: 520px) {
      header { padding: 2rem 1.25rem 3rem; }

      .result-row {
        grid-template-columns: 1fr auto;
        gap: .3rem .75rem;
      }

      .supermarket-name {
        grid-column: 1 / -1;
        margin-bottom: .1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <p class="header-label">Prijsvergelijker</p>
      <h1>Supermarkt<br>Prijsvergelijker</h1>
      <p class="header-tagline">Vind altijd de beste prijs per eenheid</p>
      <div id="search-wrap">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search" placeholder="Data wordt geladen…" disabled autocomplete="off">
      </div>
      <div id="filter-wrap" style="display:none">
        <div id="filter-row">
          <div id="filter-pill">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="7" y1="12" x2="17" y2="12"/>
              <line x1="10" y1="18" x2="14" y2="18"/>
            </svg>
            <input type="number" id="min-size" placeholder="min" min="0">
            <span class="filter-sep">–</span>
            <input type="number" id="max-size" placeholder="max" min="0">
            <span id="filter-unit-label"></span>
            <button id="filter-clear" aria-label="Wis filter" title="Wis filter">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div id="unit-filter-wrap" style="display:none"></div>
      <div id="sm-filter-wrap"></div>
    </div>
    <div class="header-wave">
      <svg viewBox="0 0 1440 52" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,28 C240,52 480,4 720,26 C960,48 1200,12 1440,28 L1440,52 L0,52 Z"
              fill="#f9fafb"/>
      </svg>
    </div>
  </header>

  <div id="status">Even geduld, data wordt geladen…</div>
  <div id="results"></div>

  <script>
    const DATA_URLS = [
      'https://www.checkjebon.nl/data/supermarkets.json',
      'https://raw.githubusercontent.com/supermarkt/checkjebon/main/data/supermarkets.json',
    ];

    let supermarketsData = null;
    const fuseCache = new Map();
    let debounceTimer = null;
    const enabledSupermarkets = new Set();

    let currentQuery  = '';
    let cachedResults = [];
    let filterUnit    = null;
    let filterMin     = null;
    let filterMax     = null;
    let negativeTerms = [];

    async function loadData() {
      for (const url of DATA_URLS) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.status);
          supermarketsData = await res.json();
          return;
        } catch (e) {
          console.warn('Could not load from', url, e);
        }
      }
      throw new Error('All data sources failed');
    }

    // --- Size parsing ---

    function parseNum(s) {
      return parseFloat(String(s).replace(',', '.'));
    }

    function weightToGrams(amount, unit) {
      switch (unit.toLowerCase()) {
        case 'mg':                  return amount / 1000;
        case 'g': case 'gram':      return amount;
        case 'kg':                  return amount * 1000;
        default:                    return null;
      }
    }

    function volumeToMl(amount, unit) {
      switch (unit.toLowerCase()) {
        case 'ml':                  return amount;
        case 'cl':                  return amount * 10;
        case 'dl':                  return amount * 100;
        case 'l': case 'liter':     return amount * 1000;
        default:                    return null;
      }
    }

    const WEIGHT_RE = /g|kg|mg|gram/i;
    const VOLUME_RE = /ml|cl|dl|l|liter/i;

    function parseSize(s) {
      if (!s) return null;
      const str = s.trim();

      // "per stuk" or bare "stuk"
      if (/^(per\s+)?stuk$/i.test(str)) return { stuks: 1 };

      // "N stuks" / "N st."
      let m = str.match(/^(\d+(?:[.,]\d+)?)\s*stuks?\.?$/i);
      if (m) return { stuks: parseNum(m[1]) };

      // "per 100 gram" / "per 100 ml" (already normalised)
      m = str.match(/^per\s+(\d+(?:[.,]\d+)?)\s*(g|kg|mg|ml|cl|dl|l|gram|liter)\b/i);
      if (m) {
        const n = parseNum(m[1]), u = m[2];
        const g = weightToGrams(n, u);
        if (g !== null) return { grams: g };
        const ml = volumeToMl(n, u);
        if (ml !== null) return { ml };
      }

      // "N x M unit" (multipacks)
      m = str.match(/^(\d+(?:[.,]\d+)?)\s*[xX×]\s*(\d+(?:[.,]\d+)?)\s*(g|kg|mg|ml|cl|dl|l|gram|liter)\b/i);
      if (m) {
        const total = parseNum(m[1]) * parseNum(m[2]), u = m[3];
        const g = weightToGrams(total, u);
        if (g !== null) return { grams: g };
        const ml = volumeToMl(total, u);
        if (ml !== null) return { ml };
      }

      // "ca. N unit" or plain "N unit"
      m = str.match(/(?:ca\.?\s*)?(\d+(?:[.,]\d+)?)\s*(g|kg|mg|ml|cl|dl|l|gram|liter)\b/i);
      if (m) {
        const n = parseNum(m[1]), u = m[2];
        const g = weightToGrams(n, u);
        if (g !== null) return { grams: g };
        const ml = volumeToMl(n, u);
        if (ml !== null) return { ml };
      }

      return null;
    }

    function calcUnitPrice(price, size) {
      if (!size) return null;
      if (size.grams > 0) return { value: price / size.grams * 100, label: '/100g' };
      if (size.ml > 0)    return { value: price / size.ml * 100,    label: '/100ml' };
      if (size.stuks > 0) return { value: price / size.stuks,        label: '/stuk' };
      return null;
    }

    function fmt(n) {
      return '€ ' + n.toFixed(2);
    }

    function normalizeStr(s) {
      return s.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function parseQuery(raw) {
      const tokens = raw.trim().split(/\s+/).filter(Boolean);
      const neg = [], pos = [];
      for (const t of tokens) {
        if (t.startsWith('-') && t.length > 1) neg.push(t.slice(1).toLowerCase());
        else pos.push(t);
      }
      return { positiveQuery: pos.join(' '), negativeTerms: neg };
    }

    function getGuaranteedMatches(products, query) {
      const words  = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const concat = normalizeStr(query);
      return products.filter(p => {
        const name     = p.n.toLowerCase();
        const nameNorm = normalizeStr(p.n);
        const allWords = words.every(w => name.includes(w));
        const concatHit = concat.length >= 2 && nameNorm.includes(concat);
        return allWords || concatHit;
      });
    }

    // --- Fuzzy search ---

    function getFuse(supermarket) {
      if (!fuseCache.has(supermarket.n)) {
        fuseCache.set(supermarket.n, new Fuse(supermarket.d, {
          keys: ['n'],
          threshold: 0.2,
          includeScore: true,
          minMatchCharLength: 2,
          useExtendedSearch: true,
        }));
      }
      return fuseCache.get(supermarket.n);
    }

    function searchSupermarket(supermarket, query) {
      const guaranteed = getGuaranteedMatches(supermarket.d, query);
      const fuzzy      = getFuse(supermarket).search(query).map(r => r.item);
      const seen = new Set(guaranteed);
      for (const item of fuzzy) seen.add(item);
      return [...seen];
    }

    // --- Size filter ---

    function determineFilterUnit(rows) {
      let g = 0, ml = 0, st = 0;
      for (const row of rows) {
        if (row.size?.grams !== undefined) g++;
        else if (row.size?.ml !== undefined) ml++;
        else if (row.size?.stuks !== undefined) st++;
      }
      if (ml >= g && ml >= st && ml > 0) return 'ml';
      if (g >= ml && g >= st && g > 0) return 'grams';
      if (st > 0) return 'stuks';
      return null;
    }

    function displayUnit(unit) {
      if (unit === 'ml')    return 'L';
      if (unit === 'grams') return 'g';
      if (unit === 'stuks') return 'stuks';
      return '';
    }

    function filterStep(unit) {
      if (unit === 'ml')    return 0.1;
      if (unit === 'grams') return 50;
      return 1;
    }

    function passesSizeFilter(size) {
      if (!size || !filterUnit || (filterMin === null && filterMax === null)) return true;
      let value;
      if      (filterUnit === 'ml'    && size.ml    !== undefined) value = size.ml / 1000;
      else if (filterUnit === 'grams' && size.grams !== undefined) value = size.grams;
      else if (filterUnit === 'stuks' && size.stuks !== undefined) value = size.stuks;
      else return true;
      if (filterMin !== null && value < filterMin) return false;
      if (filterMax !== null && value > filterMax) return false;
      return true;
    }

    function updateFilterUI(prevUnit) {
      const wrap  = document.getElementById('filter-wrap');
      const label = document.getElementById('filter-unit-label');
      const minEl = document.getElementById('min-size');
      const maxEl = document.getElementById('max-size');

      if (!filterUnit) { wrap.style.display = 'none'; return; }

      label.textContent = displayUnit(filterUnit);
      const step = filterStep(filterUnit);
      minEl.step = maxEl.step = step;

      if (prevUnit !== filterUnit) {
        filterMin = filterMax = null;
        minEl.value = '';
        maxEl.value = '';
      }

      wrap.style.display = '';
    }

    function getUnitTypes(rows) {
      const types = new Set();
      for (const row of rows) {
        if (row.size?.grams !== undefined) types.add('grams');
        else if (row.size?.ml !== undefined) types.add('ml');
        else if (row.size?.stuks !== undefined) types.add('stuks');
      }
      return types;
    }

    const UNIT_LABELS = { grams: 'gram', ml: 'ml', stuks: 'stuks' };

    function buildUnitFilter(unitTypes) {
      const wrap = document.getElementById('unit-filter-wrap');
      wrap.innerHTML = '';

      if (unitTypes.size < 2) { wrap.style.display = 'none'; return; }

      const prefix = document.createElement('span');
      prefix.className = 'filter-prefix';
      prefix.textContent = 'Eenheid:';
      wrap.appendChild(prefix);

      for (const unit of ['grams', 'ml', 'stuks']) {
        if (!unitTypes.has(unit)) continue;
        const isActive = unit === filterUnit;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sm-pill' + (isActive ? ' active' : '');
        btn.setAttribute('aria-pressed', String(isActive));
        btn.textContent = UNIT_LABELS[unit];
        btn.addEventListener('click', () => {
          if (filterUnit === unit) return;
          const prev = filterUnit;
          filterUnit = unit;
          wrap.querySelectorAll('.sm-pill').forEach(b => {
            const active = b === btn;
            b.setAttribute('aria-pressed', String(active));
            b.classList.toggle('active', active);
          });
          updateFilterUI(prev);
          applyFilterAndRender();
        });
        wrap.appendChild(btn);
      }

      wrap.style.display = '';
    }

    function buildFilters() {
      const wrap = document.getElementById('sm-filter-wrap');
      supermarketsData.forEach(sm => {
        enabledSupermarkets.add(sm.n);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sm-pill active';
        btn.setAttribute('aria-pressed', 'true');
        btn.textContent = (sm.c || sm.n).replace(/\s*\(via[^)]*\)/i, '');
        btn.addEventListener('click', () => {
          const wasActive = btn.getAttribute('aria-pressed') === 'true';
          const nowActive = !wasActive;
          btn.setAttribute('aria-pressed', String(nowActive));
          btn.classList.toggle('active', nowActive);
          if (nowActive) enabledSupermarkets.add(sm.n);
          else enabledSupermarkets.delete(sm.n);
          applyFilterAndRender();
        });
        wrap.appendChild(btn);
      });
    }

    // --- Render ---

    function applyFilterAndRender() {
      const resultsEl = document.getElementById('results');
      const statusEl  = document.getElementById('status');

      const bestBySm = new Map();
      for (const row of cachedResults) {
        if (!enabledSupermarkets.has(row.sm.n)) continue;
        if (filterUnit) {
          const ut = row.size?.grams !== undefined ? 'grams'
                   : row.size?.ml    !== undefined ? 'ml'
                   : row.size?.stuks !== undefined ? 'stuks'
                   : null;
          if (ut !== null && ut !== filterUnit) continue;
        }
        if (!passesSizeFilter(row.size)) continue;
        if (negativeTerms.length > 0 && negativeTerms.some(t => row.product.n.toLowerCase().includes(t))) continue;
        const cur = bestBySm.get(row.sm);
        if (!cur
          || (row.unitPrice && (!cur.unitPrice || row.unitPrice.value < cur.unitPrice.value))
          || (!row.unitPrice && !cur.unitPrice && row.product.p < cur.product.p)) {
          bestBySm.set(row.sm, row);
        }
      }
      const rows = [...bestBySm.values()];

      if (rows.length === 0) {
        statusEl.textContent = cachedResults.length === 0
          ? 'Geen resultaten gevonden.'
          : 'Geen resultaten binnen dit formaat.';
        resultsEl.innerHTML = '';
        return;
      }

      rows.sort((a, b) => {
        if (a.unitPrice && b.unitPrice) return a.unitPrice.value - b.unitPrice.value;
        if (a.unitPrice) return -1;
        if (b.unitPrice) return 1;
        return a.product.p - b.product.p;
      });

      statusEl.textContent = '';
      const cheapest = rows[0];

      resultsEl.innerHTML = rows.map(row => {
        const isCheapest = row === cheapest;
        const href = (row.sm.u && row.product.l) ? row.sm.u + row.product.l : null;
        const nameHtml = href
          ? `<a href="${href}" target="_blank" rel="noopener">${row.product.n}</a>`
          : row.product.n;
        const badge    = isCheapest ? `<span class="cheapest-badge">goedkoopst</span>` : '';
        const unitHtml = row.unitPrice
          ? `<div class="unit-price">${fmt(row.unitPrice.value)}${row.unitPrice.label}</div>`
          : '';

        return `
          <div class="result-row${isCheapest ? ' cheapest' : ''}">
            <div class="supermarket-name">${row.sm.c || row.sm.n}</div>
            <div class="product-name">${nameHtml}${badge}</div>
            <div class="prices">
              ${unitHtml}
              <div class="price">${fmt(row.product.p)}</div>
              <div class="size">${row.product.s || ''}</div>
            </div>
          </div>`;
      }).join('');
    }

    function search(query) {
      const resultsEl = document.getElementById('results');
      const statusEl  = document.getElementById('status');

      const { positiveQuery, negativeTerms: newNeg } = parseQuery(query);
      negativeTerms = newNeg;

      if (!positiveQuery) {
        cachedResults = [];
        currentQuery = '';
        filterUnit = null;
        updateFilterUI(filterUnit);
        buildUnitFilter(new Set());
        resultsEl.innerHTML = '';
        statusEl.textContent = '';
        return;
      }

      if (positiveQuery !== currentQuery) {
        currentQuery = positiveQuery;
        cachedResults = supermarketsData.flatMap(sm => {
          const products = searchSupermarket(sm, positiveQuery);
          return products.map(item => {
            const size      = parseSize(item.s);
            const unitPrice = calcUnitPrice(item.p, size);
            return { sm, product: item, size, unitPrice };
          });
        });

        const prevUnit = filterUnit;
        filterUnit = determineFilterUnit(cachedResults);
        updateFilterUI(prevUnit);
        buildUnitFilter(getUnitTypes(cachedResults));
      }

      applyFilterAndRender();
    }

    // --- Init ---

    const searchEl = document.getElementById('search');
    const statusEl = document.getElementById('status');

    searchEl.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => search(searchEl.value), 300);
    });

    document.getElementById('min-size').addEventListener('input', e => {
      filterMin = e.target.value !== '' ? parseFloat(e.target.value) : null;
      applyFilterAndRender();
    });
    document.getElementById('max-size').addEventListener('input', e => {
      filterMax = e.target.value !== '' ? parseFloat(e.target.value) : null;
      applyFilterAndRender();
    });
    document.getElementById('filter-clear').addEventListener('click', () => {
      filterMin = filterMax = null;
      document.getElementById('min-size').value = '';
      document.getElementById('max-size').value = '';
      applyFilterAndRender();
    });

    loadData()
      .then(() => {
        // Pre-build all Fuse indexes while the user hasn't typed yet
        supermarketsData.forEach(sm => getFuse(sm));
        buildFilters();
        statusEl.textContent = '';
        searchEl.disabled = false;
        searchEl.placeholder = 'Zoek een product… bijv. "paprika chips"';
        searchEl.focus();
      })
      .catch(() => {
        statusEl.textContent = 'Kon data niet laden. Controleer je internetverbinding en herlaad de pagina.';
      });
  </script>
</body>
</html>
